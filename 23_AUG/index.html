<!DOCTYPE html>
<html>
<head>
    <title>JavaScript</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Single Click -->
    <button onclick="console.log('Button Was Clicked');alert('Hello')">Click Me!</button>

    <!-- Double Click -->
    <button ondblclick="console.log('Button Was Clicked 2X');alert('Hello 2X')">Click Me 2 Times!</button>

    <!-- onmouseover -->
     <div onmouseover="console.log('You are inside the DIV')">This is a DIV</div>

     <!--  -->
     <button id="btn1">BTN 1</button>
     <div class="box">This is a DIV</div>

     <!-- Light Mode & Dark Mode Toggle -->
      <h1><i>This is a Heading</i></h1>
      <button id="mode">Change Mode</button>
    <script src="script.js"></script>
</body>
</html>
